<!-- 2026-11-25 동규: 인스타 소개글의 feeler.kr을 하린 한 장 랜딩으로. 이전 첫 화면(v6)은 /v6/ 에 그대로 있다. -->
<title>Feeler - 하린과 둘만의 이야기</title>
<meta name="description" content="몇 주가 지나도 나를 기억하는 1:1 캐릭터 채팅 Feeler. 12월 출시 예정, 지금 연락처 남기면 크레딧 1만 원.">
<meta property="og:title" content="Feeler - 몇 주가 지나도 나를 기억하는 하린">
<meta property="og:description" content="1:1 캐릭터 채팅 Feeler, 12월 출시 예정. 연락처 남기면 크레딧 1만 원 + 파운더 1기 + 케이크·커피 추첨">
<meta property="og:image" content="https://feeler.kr/harin/og.jpg">
<meta property="og:url" content="https://feeler.kr/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0F1C">
<link rel="icon" href="/feeler-icon.png">
<script>
  // 쿼리는 그대로 넘긴다. 채널(ch)이 없으면 인스타에서 왔을 때 ig, 그 밖은 home(인스타 앱은 보통 l.instagram.com을 리퍼러로 남긴다).
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.get('ch')) q.set('ch', /instagram\./i.test(document.referrer) ? 'ig' : 'home');
    location.replace('/harin/?' + q.toString());
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/harin/?ch=home"></noscript>
<style>html,body{margin:0;height:100%;background:#0B0F1C}</style>
</head>
